<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Window Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
:root {
  --stage: #1b2533;
  --panel: rgba(250, 249, 244, 0.88);
  --ink: #1b2533;
  --muted: #566274;
  --line: rgba(27, 37, 51, 0.16);
  --accent: #c93a1e;
  --accent-text: #a8301a;
  --focus: #1592b0;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: rgba(24, 33, 46, 0.86);
    --ink: #f3f1ea;
    --muted: #a9b4c3;
    --line: rgba(243, 241, 234, 0.18);
    --accent: #d2432a;
    --accent-text: #ff9a80;
    --focus: #3fd4f2;
  }
}
:root[data-theme="dark"] {
  --panel: rgba(24, 33, 46, 0.86);
  --ink: #f3f1ea;
  --muted: #a9b4c3;
  --line: rgba(243, 241, 234, 0.18);
  --accent: #d2432a;
  --accent-text: #ff9a80;
  --focus: #3fd4f2;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--stage); color: var(--ink);
  font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
#stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#feed { position: fixed; bottom: 0; right: 0; width: 2px; height: 2px; opacity: 0.01; pointer-events: none; }

.sheet {
  background: var(--panel);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  backdrop-filter: blur(14px) saturate(1.2);
  border: 1px solid var(--line);
  box-shadow: 0 18px 50px rgba(8, 14, 24, 0.3);
}
#start {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: min(31rem, calc(100% - 28px));
  border-radius: 24px; padding: 20px 22px 18px;
}
h1 {
  font-family: "Gochi Hand", "Comic Sans MS", cursive;
  font-weight: 400; font-size: clamp(2.4rem, 9vw, 3.3rem); line-height: 1;
  margin: 0 0 0.4rem;
}
#start p.lede { margin: 0 0 1rem; line-height: 1.45; color: var(--muted); max-width: 60ch; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
button {
  font: inherit; font-weight: 700; font-size: 1rem;
  min-height: 44px; padding: 0.6rem 1.1rem; border-radius: 999px;
  border: 1.5px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
}
button:hover { border-color: var(--ink); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.08); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
#status { margin: 0.8rem 0 0; font-size: 0.92rem; line-height: 1.4; color: var(--muted); min-height: 1.3em; }
#status.error { color: var(--accent-text); }

#tune {
  position: fixed; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  background: var(--panel);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
#hud {
  position: fixed; left: 12px; top: calc(12px + env(safe-area-inset-top, 0px));
  padding: 6px 10px; border-radius: 10px;
  font-size: 0.78rem; line-height: 1.4; white-space: pre; font-variant-numeric: tabular-nums;
  background: rgba(15, 22, 32, 0.58); color: #f3f1ea; pointer-events: none;
}
#panel {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(26rem, calc(100% - 24px)); max-height: calc(100% - 90px); overflow: auto;
  border-radius: 22px; padding: 16px 18px 14px;
}
#panel h2 { font-size: 1.05rem; margin: 0 0 0.5rem; }
.toggle { display: flex; gap: 0.65rem; align-items: flex-start; padding: 0.4rem 0; cursor: pointer; line-height: 1.35; }
.toggle input { width: 1.2rem; height: 1.2rem; margin: 0.1rem 0 0; accent-color: var(--accent); flex: none; }
.hint { display: block; font-size: 0.82rem; color: var(--muted); }
.range { padding: 0.5rem 0 0.2rem; }
.range label { display: block; font-weight: 700; font-size: 0.95rem; }
.range input { width: 100%; margin: 0.35rem 0 0.1rem; accent-color: var(--accent); }
.range input:disabled { opacity: 0.4; }
.ends { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); }
.panel-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 0.9rem; }
</style>
</head>
<body>
<canvas id="stage" aria-label="View out the window with a stick-figure runner leaping across the scene"></canvas>
<video id="feed" muted playsinline loop></video>
<div id="hud" hidden></div>

<section id="start" class="sheet" aria-labelledby="title">
  <h1 id="title">Window Runner</h1>
  <p class="lede">A stick figure that parkours across whatever's outside your window. Hold your phone up to a car window, or play back a clip you recorded from one.</p>
  <div class="actions">
    <button id="btnCamera" class="primary">Use camera</button>
    <button id="btnVideo">Play a video</button>
    <button id="btnDemo">Watch the demo</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <input type="file" id="file" accept="video/*" hidden>
</section>

<button id="tune" hidden>Tune</button>

<section id="panel" class="sheet" aria-labelledby="panelTitle" hidden>
  <h2 id="panelTitle">Tune the runner</h2>
  <div id="debugOpts" hidden>
  <label class="toggle"><input type="checkbox" id="optLine">
    <span>Show terrain line<span class="hint">The path the runner treats as ground.</span></span></label>
  <label class="toggle"><input type="checkbox" id="optEdges">
    <span>Show what the runner sees<span class="hint">Edges it accepts are highlighted.</span></span></label>
  </div>
  <label class="toggle"><input type="checkbox" id="optMotion" checked>
    <span>Prefer mid-distance objects<span class="hint">Uses motion, so it works when the view is moving, like from a car.</span></span></label>
  <div class="range">
    <label for="optFocus">Focus distance</label>
    <input type="range" id="optFocus" min="0" max="100" value="50">
    <div class="ends"><span>Near</span><span>Far</span></div>
  </div>
  <div class="range">
    <label for="optSens">Edge sensitivity</label>
    <input type="range" id="optSens" min="0" max="100" value="55">
    <div class="ends"><span>Strong edges only</span><span>Everything</span></div>
  </div>
  <div class="range">
    <label for="optTop">Ignore top of view</label>
    <input type="range" id="optTop" min="0" max="40" value="8">
    <div class="ends"><span>None</span><span>40%</span></div>
  </div>
  <div class="panel-actions">
    <button id="btnSources">Change source</button>
    <button id="btnDone" class="primary">Done</button>
  </div>
</section>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

const stage = $('stage');
const ctx = stage.getContext('2d');
const video = $('feed');
const proc = document.createElement('canvas');
const pctx = proc.getContext('2d', { willReadFrequently: true });
const edgeCanvas = document.createElement('canvas');
const ectx = edgeCanvas.getContext('2d');

// Diagnostics (stats HUD, terrain/edge overlays) only with ?debug=1 or ?debug=true
const DEBUG = /^(1|true)$/i.test(new URLSearchParams(location.search).get('debug') || '');
const settings = { showLine: DEBUG, showEdges: false, motionFilter: true, focus: 50, sensitivity: 55, ignoreTop: 8 };
const MARKER = '#3fd4f2', SCARF = '#ff5a36', INK = 'rgba(16,24,36,0.92)';

// ---------- Buffers ----------
const B = 8, RING = 6, PIXELS = 16000;
let dispW = 1, dispH = 1, dpr = 1, PW = 64, PH = 48, GX = 1, GY = 1, DMAX = 6;
let ring = [], ringTime = [], ringHead = -1, ringCount = 0;
let gray, edge, rawY, medY, terrain, terrainTmp, flow, conf, inBand, bandEff, sadGrid, edgeImg;
let edgeThr = 12, edgeMean = 0, motionActive = false, bandFlow = 0, hasTerrain = false;
let lastBand = null;
const win5 = new Float32Array(5);

function alloc() {
  const N = PW * PH;
  ring = []; ringTime = [];
  for (let i = 0; i < RING; i++) { ring.push(new Float32Array(N)); ringTime.push(0); }
  ringHead = -1; ringCount = 0;
  gray = new Float32Array(N); edge = new Float32Array(N);
  rawY = new Float32Array(PW); medY = new Float32Array(PW);
  terrain = new Float32Array(PW); terrainTmp = new Float32Array(PW);
  GX = Math.max(1, Math.floor(PW / B)); GY = Math.max(1, Math.floor(PH / B));
  flow = new Float32Array(GX * GY); conf = new Uint8Array(GX * GY);
  inBand = new Uint8Array(GX * GY); bandEff = new Uint8Array(GX * GY);
  DMAX = Math.max(6, Math.round(PW * 0.1));
  sadGrid = new Float32Array(3 * (2 * DMAX + 1));
  edgeCanvas.width = PW; edgeCanvas.height = PH;
  edgeImg = ectx.createImageData(PW, PH);
  hasTerrain = false; lastBand = null;
}

// ---------- Sources ----------
let mode = 'demo';
let objectUrl = null;

function drawCover(c, src, sw, sh, tw, th) {
  const ta = tw / th, sa = sw / sh;
  let cx = 0, cy = 0, cw = sw, ch = sh;
  if (sa > ta) { cw = sh * ta; cx = (sw - cw) / 2; } else { ch = sw / ta; cy = (sh - ch) / 2; }
  c.drawImage(src, cx, cy, cw, ch, 0, 0, tw, th);
}
function currentSource() {
  if (mode === 'demo') return { el: demo.canvas, w: demo.canvas.width, h: demo.canvas.height };
  if (video.readyState >= 2 && video.videoWidth) return { el: video, w: video.videoWidth, h: video.videoHeight };
  return null;
}

const vfc = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;
let vfcFlag = false, lastVT = -1;
if (vfc) { const cb = () => { vfcFlag = true; video.requestVideoFrameCallback(cb); }; video.requestVideoFrameCallback(cb); }
function newFrameAvailable(now) {
  if (mode === 'demo') { if (demo.fresh) { demo.fresh = false; return true; } return false; }
  if (vfcFlag) { vfcFlag = false; lastVT = video.currentTime; return true; }
  // Fallback when frame callbacks are unavailable or not firing
  if ((!vfc || now - lastProcNow > 90) && video.currentTime !== lastVT) { lastVT = video.currentTime; return true; }
  return false;
}

// ---------- Demo scene (procedural parallax, stands in for a car window) ----------
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const demo = {
  canvas: document.createElement('canvas'), c: null, W: 640, H: 360,
  acc: 0, t: 0, fresh: true, objs: [], posts: [], farOff: 0, rng: mulberry32(11),
  resize(aspect) {
    if (aspect >= 1) { this.W = 640; this.H = Math.round(640 / aspect); } else { this.H = 640; this.W = Math.round(640 * aspect); }
    this.canvas.width = this.W; this.canvas.height = this.H; this.c = this.canvas.getContext('2d');
    this.objs = []; this.posts = [];
    let x = -this.W * 0.1; while (x < this.W * 1.5) x = this.spawn(x);
    for (let px = this.W * 0.2; px < this.W * 1.6; px += this.W * 0.45) this.posts.push(px);
    this.render(); this.fresh = true;
  },
  spawn(x) {
    const r = this.rng, W = this.W, H = this.H, roll = r();
    let o;
    if (roll < 0.45) {
      const palette = ['#6c7b8e', '#8b6f5b', '#5f6e5b', '#7c6f8b', '#9a7f62'];
      o = { kind: 'building', w: W * (0.12 + r() * 0.16), h: H * (0.14 + r() * 0.28), color: palette[(r() * palette.length) | 0], seed: (r() * 1e9) | 0 };
    } else if (roll < 0.78) {
      o = { kind: 'tree', w: W * (0.09 + r() * 0.07), h: H * (0.18 + r() * 0.15), seed: (r() * 1e9) | 0 };
    } else {
      const cars = ['#b8423a', '#3d6fa8', '#d7c9a8', '#4a4f57'];
      o = { kind: 'car', w: W * 0.14, h: H * 0.085, color: cars[(r() * cars.length) | 0] };
    }
    o.x = x; this.objs.push(o);
    return x + o.w + W * (0.02 + r() * 0.16);
  },
  tick(dt) {
    this.acc += dt;
    if (this.acc < 1 / 30) return;
    const step = Math.min(this.acc, 0.1); this.acc = 0; this.t += step;
    const W = this.W, mid = W * 0.26 * step;
    for (const o of this.objs) o.x -= mid;
    this.objs = this.objs.filter((o) => o.x + o.w > -W * 0.2);
    let right = this.objs.length ? Math.max(...this.objs.map((o) => o.x + o.w)) : 0;
    while (right < W * 1.4) right = this.spawn(right + W * 0.05);
    this.farOff += W * 0.025 * step;
    const spacing = W * 0.45;
    for (let i = 0; i < this.posts.length; i++) {
      this.posts[i] -= W * 1.05 * step;
      if (this.posts[i] < -W * 0.05) this.posts[i] += spacing * this.posts.length;
    }
    this.render(); this.fresh = true;
  },
  render() {
    const c = this.c, W = this.W, H = this.H, gy = H * 0.8, t = this.t;
    c.save();
    c.translate(Math.sin(t * 7.3) * W * 0.003, Math.sin(t * 11.1) * H * 0.004 + Math.sin(t * 3.1) * H * 0.003);
    const sky = c.createLinearGradient(0, 0, 0, gy);
    sky.addColorStop(0, '#8fbfe0'); sky.addColorStop(1, '#dce9ef');
    c.fillStyle = sky; c.fillRect(-30, -30, W + 60, gy + 30);
    c.fillStyle = '#9fb3c3'; c.beginPath(); c.moveTo(-30, gy);
    for (let x = -30; x <= W + 30; x += 6) {
      const u = (x + this.farOff) / W;
      c.lineTo(x, H * 0.5 + Math.sin(u * 5.1) * H * 0.05 + Math.sin(u * 13.7 + 1) * H * 0.025);
    }
    c.lineTo(W + 30, gy); c.closePath(); c.fill();
    c.fillStyle = '#8a9a6c'; c.fillRect(-30, gy, W + 60, H);
    c.fillStyle = '#5d6462'; c.fillRect(-30, H * 0.9, W + 60, H);
    for (const o of this.objs) this.drawObj(c, o, gy);
    // near posts and a sagging wire: fast, close clutter the motion filter should ignore
    c.fillStyle = '#262b31';
    for (const px of this.posts) c.fillRect(px, H * 0.66, W * 0.018, H * 0.4);
    c.strokeStyle = 'rgba(30,30,32,0.7)'; c.lineWidth = 2; c.beginPath();
    const sorted = [...this.posts].sort((a, b) => a - b);
    for (let i = 0; i < sorted.length - 1; i++) {
      const a = sorted[i] + W * 0.009, b = sorted[i + 1] + W * 0.009;
      c.moveTo(a, H * 0.67); c.quadraticCurveTo((a + b) / 2, H * 0.73, b, H * 0.67);
    }
    c.stroke();
    c.restore();
  },
  drawObj(c, o, gy) {
    if (o.kind === 'building') {
      c.fillStyle = o.color; c.fillRect(o.x, gy - o.h, o.w, o.h);
      c.fillStyle = 'rgba(0,0,0,0.18)'; c.fillRect(o.x, gy - o.h, o.w, 4);
      const rr = mulberry32(o.seed);
      for (let y = gy - o.h + 10; y < gy - 14; y += 18) for (let x = o.x + 8; x < o.x + o.w - 12; x += 14) {
        c.fillStyle = rr() < 0.7 ? 'rgba(255,240,200,0.6)' : 'rgba(30,35,45,0.5)';
        c.fillRect(x, y, 7, 10);
      }
    } else if (o.kind === 'tree') {
      const cx = o.x + o.w / 2, rr = mulberry32(o.seed);
      c.fillStyle = '#5b4636'; c.fillRect(cx - o.w * 0.06, gy - o.h * 0.45, o.w * 0.12, o.h * 0.45);
      for (let i = 0; i < 7; i++) {
        c.fillStyle = i % 2 ? '#3e6538' : '#4f7d47';
        c.beginPath();
        c.arc(cx + (rr() - 0.5) * o.w * 0.5, gy - o.h * (0.55 + rr() * 0.25), o.w * (0.22 + rr() * 0.12), 0, Math.PI * 2);
        c.fill();
      }
    } else {
      const y = gy - o.h;
      c.fillStyle = o.color;
      c.fillRect(o.x, y + o.h * 0.35, o.w, o.h * 0.5);
      c.fillRect(o.x + o.w * 0.2, y, o.w * 0.55, o.h * 0.4);
      c.fillStyle = 'rgba(200,225,240,0.8)'; c.fillRect(o.x + o.w * 0.25, y + o.h * 0.07, o.w * 0.2, o.h * 0.27); c.fillRect(o.x + o.w * 0.5, y + o.h * 0.07, o.w * 0.2, o.h * 0.27);
      c.fillStyle = '#1e2126';
      c.beginPath(); c.arc(o.x + o.w * 0.22, gy - o.h * 0.1, o.h * 0.18, 0, 7); c.arc(o.x + o.w * 0.78, gy - o.h * 0.1, o.h * 0.18, 0, 7); c.fill();
    }
  }
};

// ---------- Vision pipeline ----------
function blur(src, out, tmp) {
  for (let y = 0; y < PH; y++) {
    const r = y * PW;
    for (let x = 0; x < PW; x++) {
      const xl = x > 0 ? x - 1 : x, xr = x < PW - 1 ? x + 1 : x;
      tmp[r + x] = (src[r + xl] + 2 * src[r + x] + src[r + xr]) * 0.25;
    }
  }
  for (let y = 0; y < PH; y++) {
    const ru = (y > 0 ? y - 1 : y) * PW, r = y * PW, rd = (y < PH - 1 ? y + 1 : y) * PW;
    for (let x = 0; x < PW; x++) out[r + x] = (tmp[ru + x] + 2 * tmp[r + x] + tmp[rd + x]) * 0.25;
  }
}

function sobel(s, out) {
  out.fill(0);
  let sum = 0, sum2 = 0, n = 0;
  for (let y = 1; y < PH - 1; y++) {
    for (let x = 1; x < PW - 1; x++) {
      const i = y * PW + x;
      const a = s[i - PW - 1], b = s[i - PW], c = s[i - PW + 1], d = s[i - 1], f = s[i + 1], g = s[i + PW - 1], h = s[i + PW], k = s[i + PW + 1];
      const gx = (c + 2 * f + k) - (a + 2 * d + g);
      const gy = (g + 2 * h + k) - (a + 2 * b + c);
      const m = Math.abs(gx) + Math.abs(gy);
      out[i] = m; sum += m; sum2 += m * m; n++;
    }
  }
  edgeMean = sum / n;
  const sd = Math.sqrt(Math.max(0, sum2 / n - edgeMean * edgeMean));
  const k = 2.6 - (settings.sensitivity / 100) * 2.2;
  edgeThr = Math.max(12, edgeMean + k * sd);
}

// Block-matching horizontal motion per 8x8 block. Mid-ground = the dominant moving speed band.
function computeFlow(now) {
  conf.fill(0); flow.fill(0); inBand.fill(0); bandEff.fill(0);
  motionActive = false; bandFlow = 0;
  if (ringCount < 2) return;
  let refIdx = -1, age = 0;
  for (let k = 1; k < ringCount; k++) {
    const idx = (ringHead - k + RING) % RING;
    refIdx = idx; age = now - ringTime[idx];
    if (age >= 60) break;
  }
  if (refIdx < 0 || age <= 0 || age > 400) return;
  const cur = ring[ringHead], ref = ring[refIdx];
  const D = DMAX, span = 2 * D + 1, texMin = edgeMean * 1.1;
  for (let by = 0; by < GY; by++) for (let bx = 0; bx < GX; bx++) {
    const gi = by * GX + bx, x0 = bx * B, y0 = by * B;
    let tex = 0;
    for (let y = y0; y < y0 + B; y++) { const r = y * PW; for (let x = x0; x < x0 + B; x++) tex += edge[r + x]; }
    if (tex / (B * B) < texMin) continue;
    sadGrid.fill(Infinity);
    let best = Infinity, bestDx = 0, bestDy = 0, total = 0, cnt = 0;
    for (let dy = -1; dy <= 1; dy++) {
      const ry0 = y0 - dy;
      if (ry0 < 0 || ry0 + B > PH) continue;
      for (let dx = -D; dx <= D; dx++) {
        const rx0 = x0 - dx;
        if (rx0 < 0 || rx0 + B > PW) continue;
        let sad = 0;
        for (let y = 0; y < B; y++) {
          const rc = (y0 + y) * PW + x0, rr = (ry0 + y) * PW + rx0;
          for (let x = 0; x < B; x++) sad += Math.abs(cur[rc + x] - ref[rr + x]);
        }
        sadGrid[(dy + 1) * span + dx + D] = sad;
        total += sad; cnt++;
        if (sad < best) { best = sad; bestDx = dx; bestDy = dy; }
      }
    }
    if (!cnt || bestDx <= -D || bestDx >= D || best > 0.6 * (total / cnt)) continue;
    const row = (bestDy + 1) * span + bestDx + D;
    const l = sadGrid[row - 1], r = sadGrid[row + 1];
    let sub = 0;
    if (isFinite(l) && isFinite(r)) { const den = l - 2 * best + r; if (den > 1e-6) sub = clamp(0.5 * (l - r) / den, -0.5, 0.5); }
    flow[gi] = (bestDx + sub) * 1000 / age; // processing px per second
    conf[gi] = 1;
  }

  const minMove = PW * 0.06;
  const moving = []; let signSum = 0;
  for (let gi = 0; gi < GX * GY; gi++) if (conf[gi] && Math.abs(flow[gi]) > minMove) { moving.push(Math.abs(flow[gi])); signSum += flow[gi]; }
  let band = null;
  if (moving.length >= 4) {
    moving.sort((a, b) => a - b);
    const refSpeed = moving[moving.length >> 1] * Math.pow(2, (50 - settings.focus) / 50);
    band = { lo: refSpeed * 0.5, hi: refSpeed * 1.8, dom: Math.sign(signSum) || 1, t: now };
    lastBand = band;
  } else if (lastBand && now - lastBand.t < 600) {
    band = lastBand; // brief hold so the filter doesn't flicker
  }
  if (!band) return;
  const vals = [];
  for (let gi = 0; gi < GX * GY; gi++) {
    if (!conf[gi]) continue;
    const v = flow[gi], av = Math.abs(v);
    if (Math.sign(v) === band.dom && av >= band.lo && av <= band.hi) { inBand[gi] = 1; vals.push(v); }
  }
  if (!vals.length) return;
  vals.sort((a, b) => a - b);
  bandFlow = vals[vals.length >> 1];
  motionActive = true;
  // Let untrackable blocks (plain rooflines, flat edges) borrow a neighbour's verdict
  for (let by = 0; by < GY; by++) for (let bx = 0; bx < GX; bx++) {
    const gi = by * GX + bx;
    if (inBand[gi]) { bandEff[gi] = 1; continue; }
    if (conf[gi]) continue;
    if ((by < GY - 1 && inBand[gi + GX]) || (bx > 0 && inBand[gi - 1]) || (bx < GX - 1 && inBand[gi + 1])) bandEff[gi] = 1;
  }
}

function accepted(x, y, useMotion) {
  if (!useMotion) return true;
  return bandEff[Math.min(GY - 1, (y / B) | 0) * GX + Math.min(GX - 1, (x / B) | 0)] === 1;
}

function skyline(dtProc) {
  const top0 = Math.round(PH * settings.ignoreTop / 100);
  const useMotion = settings.motionFilter && motionActive;
  const floorY = PH * 0.94;
  for (let x = 0; x < PW; x++) {
    let found = floorY;
    for (let y = Math.max(1, top0); y < PH - 1; y++) {
      if (edge[y * PW + x] > edgeThr && accepted(x, y, useMotion)) { found = y; break; }
    }
    rawY[x] = Math.min(found, floorY);
  }
  for (let x = 0; x < PW; x++) {
    for (let k = -2; k <= 2; k++) win5[k + 2] = rawY[clamp(x + k, 0, PW - 1)];
    win5.sort(); medY[x] = win5[2];
  }
  const shift = hasTerrain ? bandFlow * dtProc : 0;
  for (let x = 0; x < PW; x++) {
    const sx = x - shift;
    if (hasTerrain && sx >= 0 && sx <= PW - 1) {
      const i0 = sx | 0, f = sx - i0;
      const prev = terrain[i0] * (1 - f) + terrain[Math.min(PW - 1, i0 + 1)] * f;
      terrainTmp[x] = prev + (medY[x] - prev) * 0.5;
    } else terrainTmp[x] = medY[x];
  }
  const t = terrain; terrain = terrainTmp; terrainTmp = t;
  hasTerrain = true;
}

let lastProcNow = 0, procMs = 0;
function processFrame(src, now) {
  const t0 = performance.now();
  const dtProc = lastProcNow ? Math.min(0.25, (now - lastProcNow) / 1000) : 0;
  lastProcNow = now;
  drawCover(pctx, src.el, src.w, src.h, PW, PH);
  const d = pctx.getImageData(0, 0, PW, PH).data;
  const N = PW * PH;
  for (let i = 0, j = 0; i < N; i++, j += 4) gray[i] = 0.299 * d[j] + 0.587 * d[j + 1] + 0.114 * d[j + 2];
  ringHead = (ringHead + 1) % RING; ringCount = Math.min(RING, ringCount + 1);
  ringTime[ringHead] = now;
  blur(gray, ring[ringHead], edge);
  sobel(ring[ringHead], edge);
  computeFlow(now);
  skyline(dtProc);
  procMs = lerp(procMs, performance.now() - t0, 0.1);
}

// ---------- Terrain queries in display space ----------
function minSurface(x0, x1) {
  if (!hasTerrain) return dispH * 0.92;
  const i0 = clamp(Math.floor(Math.min(x0, x1) / dispW * PW), 0, PW - 1);
  const i1 = clamp(Math.ceil(Math.max(x0, x1) / dispW * PW), 0, PW - 1);
  let m = Infinity;
  for (let i = i0; i <= i1; i++) if (terrain[i] < m) m = terrain[i];
  return (m + 0.5) * dispH / PH;
}

// ---------- Runner ----------
let scrollV = 0, timeS = 0;
const runnerSize = () => clamp(dispH * 0.11, 38, 100);
const gravity = () => dispH * 3.2;
const runner = {
  x: 0, y: 0, vy: 0, state: 'air', facing: 1, phase: 0, squash: 0, rot: 0, flipDir: 0,
  airT: 0, airDur: 1, airBlend: 1, kicks: 0, under: 0, scarf: [],
  reset() { this.x = dispW * 0.3; this.y = dispH * 0.5; this.vy = 0; this.state = 'air'; this.airT = 0; this.airDur = 1; this.flipDir = 0; this.rot = 0; this.scarf = []; }
};

function jump(h, landY, isKick) {
  const s = runnerSize(), g = gravity();
  h = clamp(h, s * 0.35, dispH * 0.6);
  h = Math.max(s * 0.2, Math.min(h, runner.y - s * 1.35));
  const v0 = Math.sqrt(2 * g * h);
  runner.vy = -v0; runner.state = 'air'; runner.airT = 0; runner.rot = 0;
  const fall = Math.max(s * 0.1, landY - (runner.y - h));
  runner.airDur = v0 / g + Math.sqrt(2 * fall / g);
  runner.flipDir = (!isKick && h > s * 1.1 && Math.random() < 0.55) ? runner.facing : 0;
  if (!isKick) runner.kicks = 0;
}
function land(y) {
  runner.y = y; runner.vy = 0; runner.state = 'ground';
  runner.squash = 1; runner.rot = 0; runner.flipDir = 0; runner.kicks = 0;
}

function updateRunner(dt) {
  const s = runnerSize(), g = gravity(), stepH = s * 0.3, fh = s * 0.14;
  if (scrollV < -dispW * 0.02) runner.facing = 1;
  else if (scrollV > dispW * 0.02) runner.facing = -1;
  const anchor = runner.facing > 0 ? dispW * 0.3 : dispW * 0.7;
  runner.x += (anchor - runner.x) * Math.min(1, dt * 2);
  const speed = Math.abs(scrollV);
  runner.phase += dt * (10 + Math.min(12, speed / dispW * 16));
  const under = minSurface(runner.x - fh, runner.x + fh);
  runner.under = under;

  if (runner.state === 'ground') {
    const look = clamp(speed * 0.45, s * 0.7, dispW * 0.3);
    const a0 = runner.x + runner.facing * fh, a1 = runner.x + runner.facing * look;
    const aheadTop = minSurface(a0, a1);
    const rise = runner.y - aheadTop;
    if (rise > stepH) jump(rise + s * 0.35, aheadTop, false);
    else if (under < runner.y - stepH) jump(runner.y - under + s * 0.3, under, false);
    else if (under > runner.y + stepH * 1.2) { runner.state = 'air'; runner.vy = 0; runner.airT = 0; runner.airDur = 1; runner.flipDir = 0; }
    else runner.y += (under - runner.y) * Math.min(1, dt * 16);
  } else {
    runner.airT += dt;
    runner.vy += g * dt;
    runner.y += runner.vy * dt;
    if (runner.vy > 0 && runner.y >= under) {
      if (runner.y - under > s * 0.7 && runner.kicks < 2) { runner.kicks++; jump(runner.y - under + s * 0.4, under, true); }
      else land(under);
    }
    if (runner.y > dispH + s) land(under);
    if (runner.flipDir) {
      const p = clamp(runner.airT / (runner.airDur * 0.9), 0, 1);
      const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      runner.rot = runner.flipDir * Math.PI * 2 * e;
    }
  }
  runner.squash = Math.max(0, runner.squash - dt * 5);
  runner.airBlend += ((runner.state === 'air' ? 1 : 0) - runner.airBlend) * Math.min(1, dt * 14);
}

function updateScarf(anchor, dt, s) {
  const n = 8, seg = s * 0.075, sc = runner.scarf;
  if (sc.length !== n) { sc.length = 0; for (let i = 0; i < n; i++) sc.push({ x: anchor.x - runner.facing * seg * i, y: anchor.y, px: anchor.x - runner.facing * seg * i, py: anchor.y }); }
  sc[0].x = sc[0].px = anchor.x; sc[0].y = sc[0].py = anchor.y;
  const h = Math.min(dt, 1 / 30);
  const wind = -runner.facing * (dispH * 1.6 + Math.abs(scrollV) * 2);
  const grav = dispH * 0.9;
  for (let i = 1; i < n; i++) {
    const p = sc[i];
    const vx = (p.x - p.px) * 0.9, vy = (p.y - p.py) * 0.9;
    p.px = p.x; p.py = p.y;
    p.x += vx + wind * h * h;
    p.y += vy + grav * h * h + Math.sin(timeS * 19 + i * 0.9) * s * 0.006;
  }
  for (let it = 0; it < 4; it++) for (let i = 1; i < n; i++) {
    const a = sc[i - 1], b = sc[i];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-3;
    b.x = a.x + dx / d * seg; b.y = a.y + dy / d * seg;
  }
}

function drawRunner(dt) {
  const s = runnerSize(), f = runner.facing, p = runner.phase;
  const fall = clamp(runner.vy / (dispH * 1.4), 0, 1);
  // pose: lean, thigh1, knee1, thigh2, knee2, upperArm1, elbow1, upperArm2, elbow2 (radians, 0 = straight down)
  const run = [0.3, Math.sin(p) * 0.85, 0.3 + 0.9 * Math.max(0, Math.sin(p - 1.3)),
               Math.sin(p + Math.PI) * 0.85, 0.3 + 0.9 * Math.max(0, Math.sin(p + Math.PI - 1.3)),
               -Math.sin(p) * 0.9, 1.4, Math.sin(p) * 0.9, 1.4];
  const air = [0.12, lerp(1.5, 0.5, fall), lerp(2.1, 0.5, fall), lerp(0.9, -0.2, fall), lerp(1.9, 0.4, fall),
               lerp(2.6, 2.3, fall), 0.5, lerp(2.2, 2.8, fall), 0.4];
  const a = runner.airBlend, q = runner.squash;
  const P = run.map((v, i) => lerp(v, air[i], a));
  P[0] += q * 0.25; P[1] += q * 0.7; P[2] += q * 1.3; P[3] += q * 0.5; P[4] += q * 1.2;
  const [lean, t1, k1, t2, k2, u1, e1, u2, e2] = P;
  const L1 = s * 0.25, L2 = s * 0.25, T = s * 0.3, U = s * 0.17, F = s * 0.16, R = s * 0.1;
  const leg = (t, k) => [L1 * Math.sin(t), L1 * Math.cos(t), L1 * Math.sin(t) + L2 * Math.sin(t - k), L1 * Math.cos(t) + L2 * Math.cos(t - k)];
  const l1 = leg(t1, k1), l2 = leg(t2, k2);
  const drop = Math.max(l1[3], l2[3]);
  const bob = (1 - a) * Math.abs(Math.cos(p)) * s * 0.03;
  const hy = lerp(runner.y - drop - bob, runner.y - (L1 + L2) * 0.85, a), hx = runner.x;

  const piv = { x: hx, y: hy - s * 0.12 }, cr = Math.cos(runner.rot), sr = Math.sin(runner.rot);
  const P2 = (dx, dy) => { const x = hx + dx * f - piv.x, y = hy + dy - piv.y; return { x: piv.x + x * cr - y * sr, y: piv.y + x * sr + y * cr }; };
  const hip = P2(0, 0);
  const sh = { dx: Math.sin(lean) * T, dy: -Math.cos(lean) * T };
  const shoulder = P2(sh.dx, sh.dy);
  const headC = P2(sh.dx + Math.sin(lean) * (R + s * 0.05), sh.dy - Math.cos(lean) * (R + s * 0.05));
  const arm = (u, e) => {
    const ex = sh.dx + U * Math.sin(u), ey = sh.dy + U * Math.cos(u);
    return [P2(ex, ey), P2(ex + F * Math.sin(u + e), ey + F * Math.cos(u + e))];
  };
  const [el1, ha1] = arm(u1, e1), [el2, ha2] = arm(u2, e2);
  const kn1 = P2(l1[0], l1[1]), ft1 = P2(l1[2], l1[3]);
  const kn2 = P2(l2[0], l2[1]), ft2 = P2(l2[2], l2[3]);

  // ground shadow
  const lift = clamp((runner.under - runner.y) / (dispH * 0.4), 0, 1);
  ctx.fillStyle = `rgba(0,0,0,${0.28 * (1 - lift)})`;
  ctx.beginPath(); ctx.ellipse(runner.x, runner.under, s * 0.22 * (1 - lift * 0.5), s * 0.045, 0, 0, Math.PI * 2); ctx.fill();

  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const limb = (pts, color) => {
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = INK; ctx.lineWidth = s * 0.1; ctx.stroke();
    ctx.strokeStyle = color; ctx.lineWidth = s * 0.055; ctx.stroke();
  };

  // scarf trails from the neck
  updateScarf(shoulder, dt, s);
  ctx.beginPath(); ctx.moveTo(runner.scarf[0].x, runner.scarf[0].y);
  for (let i = 1; i < runner.scarf.length; i++) ctx.lineTo(runner.scarf[i].x, runner.scarf[i].y);
  ctx.strokeStyle = INK; ctx.lineWidth = s * 0.085; ctx.stroke();
  ctx.strokeStyle = SCARF; ctx.lineWidth = s * 0.05; ctx.stroke();

  limb([shoulder, el2, ha2], '#cfd5dc');
  limb([hip, kn2, ft2], '#cfd5dc');
  limb([hip, shoulder], '#ffffff');
  limb([hip, kn1, ft1], '#ffffff');
  ctx.beginPath(); ctx.arc(headC.x, headC.y, R, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = s * 0.03; ctx.stroke();
  limb([shoulder, el1, ha1], '#ffffff');
}

// ---------- Overlays ----------
function drawTerrain() {
  const sx = dispW / PW, sy = dispH / PH;
  ctx.beginPath();
  for (let i = 0; i < PW; i++) {
    const x = (i + 0.5) * sx, y = (terrain[i] + 0.5) * sy;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(12,18,28,0.45)'; ctx.lineWidth = 5; ctx.stroke();
  ctx.strokeStyle = MARKER; ctx.lineWidth = 2.5; ctx.stroke();
}
function drawEdges() {
  const data = edgeImg.data, useMotion = settings.motionFilter && motionActive;
  const top0 = Math.round(PH * settings.ignoreTop / 100);
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
    const i = y * PW + x, o = i * 4, m = edge[i];
    if (m > edgeThr && y >= top0 && accepted(x, y, useMotion)) { data[o] = 63; data[o + 1] = 212; data[o + 2] = 242; data[o + 3] = 255; }
    else { const v = Math.min(190, m * 0.3); data[o] = data[o + 1] = data[o + 2] = v; data[o + 3] = 230; }
  }
  ectx.putImageData(edgeImg, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(edgeCanvas, 0, 0, dispW, dispH);
  ctx.imageSmoothingEnabled = true;
  if (top0 > 0) { ctx.fillStyle = 'rgba(15,22,32,0.5)'; ctx.fillRect(0, 0, dispW, top0 * dispH / PH); }
}

// ---------- Loop ----------
const hud = $('hud');
let lastT = performance.now(), fps = 60, hudT = 0;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0.001, (now - lastT) / 1000));
  lastT = now; timeS += dt;
  fps = lerp(fps, 1 / dt, 0.05);
  if (mode === 'demo') demo.tick(dt);
  const src = currentSource();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (src) {
    if (newFrameAvailable(now)) processFrame(src, now);
    drawCover(ctx, src.el, src.w, src.h, dispW, dispH);
  } else {
    ctx.fillStyle = '#1b2533'; ctx.fillRect(0, 0, dispW, dispH);
  }
  scrollV += ((motionActive ? bandFlow * dispW / PW : 0) - scrollV) * Math.min(1, dt * 6);
  if (settings.showEdges && hasTerrain) drawEdges();
  if (settings.showLine && hasTerrain) drawTerrain();
  updateRunner(dt);
  drawRunner(dt);
  if (!hud.hidden && now - hudT > 250) {
    hudT = now;
    const motion = !settings.motionFilter ? 'Motion filter off' : motionActive ? 'Tracking mid-distance' : 'Motion filter waiting for movement';
    hud.textContent = `${Math.round(fps)} fps\nVision ${procMs.toFixed(1)} ms per frame at ${PW}×${PH}\nScroll ${Math.round(scrollV)} px/s\n${motion}`;
  }
  requestAnimationFrame(frame);
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  dispW = Math.max(1, window.innerWidth); dispH = Math.max(1, window.innerHeight);
  stage.width = Math.round(dispW * dpr); stage.height = Math.round(dispH * dpr);
  const aspect = dispW / dispH;
  PW = Math.max(64, Math.round(Math.sqrt(PIXELS * aspect)));
  PH = Math.max(48, Math.round(PW / aspect));
  proc.width = PW; proc.height = PH;
  alloc();
  demo.resize(aspect);
  resetTracking();
}
function resetTracking() {
  ringHead = -1; ringCount = 0; hasTerrain = false; lastBand = null;
  motionActive = false; bandFlow = 0; scrollV = 0; lastProcNow = 0;
  runner.reset();
}

// ---------- UI ----------
const start = $('start'), status = $('status'), tuneBtn = $('tune'), panel = $('panel'), fileInput = $('file');
function setStatus(msg, isError) { status.textContent = msg || ''; status.classList.toggle('error', !!isError); }
function enterRun() { start.hidden = true; panel.hidden = true; tuneBtn.hidden = false; hud.hidden = !DEBUG; setStatus(''); }
function showStart() { start.hidden = false; panel.hidden = true; tuneBtn.hidden = true; hud.hidden = true; }
function stopStream() {
  const so = video.srcObject;
  if (so && so.getTracks) so.getTracks().forEach((t) => t.stop());
  video.srcObject = null;
}
function cameraError(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError') return 'Camera access was blocked. Some viewers don\'t allow the camera inside embedded pages. Open this page on its own over HTTPS, or play a video instead.';
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'No usable camera was found on this device.';
  if (n === 'NotReadableError') return 'The camera is in use by another app. Close it and try again.';
  return `The camera couldn't start (${n || 'unknown error'}). Try playing a video instead.`;
}

$('btnCamera').addEventListener('click', async () => {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('Camera isn\'t available here. It needs a secure (HTTPS) page. Play a video instead.', true); return;
  }
  setStatus('Asking for camera access…');
  try {
    stopStream();
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }, audio: false
    });
    video.removeAttribute('src'); video.srcObject = stream;
    await video.play();
    mode = 'video'; resetTracking(); enterRun();
  } catch (e) { mode = 'demo'; setStatus(cameraError(e), true); }
});
$('btnVideo').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const file = fileInput.files && fileInput.files[0];
  fileInput.value = '';
  if (!file) return;
  try {
    stopStream();
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(file);
    video.src = objectUrl;
    await video.play();
    mode = 'video'; resetTracking(); enterRun();
  } catch (e) { setStatus('That video couldn\'t be played. Try an MP4 or WebM file.', true); }
});
$('btnDemo').addEventListener('click', () => { stopStream(); video.pause(); mode = 'demo'; resetTracking(); enterRun(); });
tuneBtn.addEventListener('click', () => { panel.hidden = false; tuneBtn.hidden = true; $(DEBUG ? 'optLine' : 'optMotion').focus(); });
$('btnDone').addEventListener('click', () => { panel.hidden = true; tuneBtn.hidden = false; tuneBtn.focus(); });
$('btnSources').addEventListener('click', () => { showStart(); $('btnCamera').focus(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !panel.hidden) $('btnDone').click(); });

const focusInput = $('optFocus');
$('debugOpts').hidden = !DEBUG;
$('optLine').checked = settings.showLine;
$('optLine').addEventListener('change', (e) => { settings.showLine = e.target.checked; });
$('optEdges').addEventListener('change', (e) => { settings.showEdges = e.target.checked; });
$('optMotion').addEventListener('change', (e) => { settings.motionFilter = e.target.checked; focusInput.disabled = !e.target.checked; });
focusInput.addEventListener('input', (e) => { settings.focus = +e.target.value; lastBand = null; });
$('optSens').addEventListener('input', (e) => { settings.sensitivity = +e.target.value; });
$('optTop').addEventListener('input', (e) => { settings.ignoreTop = +e.target.value; });

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
